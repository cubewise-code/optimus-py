[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimuspy"
version = "2.0.0"
description = "OptimusPy — TM1 Cube Dimension Order Optimizer"
readme = "README.md"
license = "MIT"
authors = [
    {name = "nicolasbisurgi", email = "nbisurgi@cubewise.com"},
]
maintainers = [
    {name = "Cubewise CODE"},
]
keywords = ["TM1", "Planning Analytics", "TM1Py", "dimension order", "optimization", "cube"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "TM1py>=2.3.0",
    "configparser>=3.5.3",
    "mdxpy>=0.2",
    "xlsxwriter",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=5.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The default run is offline: no TM1 connection, no network, nothing to
# configure. Live tests are opt-in — `pytest -m live --instance tm1srv01` — so
# CI and a fresh clone both get a suite that passes with no server.
addopts = "--import-mode=importlib -m 'not live'"
markers = [
    "live: needs a real TM1Service against tm1srv01 (v11) or tm1srv02 (v12); deselected by default",
]

[project.urls]
Repository = "https://github.com/cubewise-code/optimus-py"

[project.scripts]
optimuspy = "optimuspy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optimuspy" = ["images/*.png", "images/*.svg"]
