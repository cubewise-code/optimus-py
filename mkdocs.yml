site_name: OptimusPy Documentation
site_description: Find the ideal dimension order for IBM TM1/Planning Analytics cubes
site_author: Cubewise CODE
# The React landing page owns the site root; the deploy workflow publishes the
# MkDocs build under /docs/, so canonical URLs and the sitemap must say so too.
site_url: https://cubewise-code.github.io/optimus-py/docs/
site_dir: mkdocs_site

repo_name: cubewise-code/optimus-py
repo_url: https://github.com/cubewise-code/optimus-py
edit_uri: edit/master/docs/

copyright: Copyright &copy; Cubewise CODE

# Exclude internal planning content from the public site
# Kept out of the built site entirely, not merely out of the nav. mkdocs renders
# every .md under docs/ whether or not the nav references it, so a page left out
# of the nav is still published at its URL and still indexed by the search
# plugin. The ADRs are internal records for contributors; they live in the repo
# and do not ship.
exclude_docs: |
  superpowers/
  plans/
  adr/
  guide/diagrams/src/
  *.docx

theme:
  name: material
  language: en
  logo: assets/images/optimuspy/logo.svg
  favicon: assets/images/optimuspy/icon.png
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      tip: octicons/squirrel-16
      warning: octicons/alert-16
      info: octicons/info-16
      success: octicons/check-16

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-theme.js

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://cubewise.com
      name: Cubewise
    - icon: fontawesome/brands/github
      link: https://github.com/cubewise-code/optimus-py
      name: GitHub Repository
  homepage: https://cubewise-code.github.io/optimus-py/
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/cubewise-code/optimus-py/issues/new/?title=[Docs]+{title}+-+{url}" target="_blank" rel="noopener">opening an issue</a>.

nav:
  - Home: index.md
  - What's New in 2.0.0: v2-features.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - TM1 Connection: getting-started/tm1-connection.md
      - Quick Start: getting-started/quick-start.md
  - User Guide:
      - Choose a Mode: guide/choose-a-mode.md
      - Your First Optimization: guide/first-optimization.md
      - What Happens During a Run: guide/during-a-run.md
      - Reading the Result: guide/reading-the-result.md
      - Taking an Order to Production: guide/taking-an-order-to-production.md
      - Optimize DB Step by Step: guide/optimize-db-step-by-step.md
  - Web UI:
      - Overview: ui/overview.md
      - Optimize Page: ui/optimize-page.md
      - Results Page: ui/results-page.md
      - Sync Order Page: ui/sync-order-page.md
      - Optimize DB Page: ui/optimize-db-page.md
      - Settings Page: ui/settings-page.md
      - Jobs Page: ui/jobs-page.md
  - Modes:
      - Optimize Mode: modes/optimize-mode.md
      - Predefined Orders: modes/predefined-orders.md
      - Position Optimization: modes/position-optimization.md
      - Dimension Optimization: modes/dimension-optimization.md
      - Set Mode: modes/set-mode.md
      - Scan Mode: modes/scan-mode.md
      - Optimize DB Mode: modes/optimize-db.md
  - Concepts:
      - How It Works: concepts/how-it-works.md
      - Cardinality-Aware Greedy: concepts/cardinality-aware-greedy.md
      - RAM vs Query Tradeoff: concepts/ram-vs-query-tradeoff.md
      - The Locked Slot: concepts/string-element-constraint.md
      - VMM/VMT Handling: concepts/vmm-vmt-handling.md
  - Advanced:
      - CLI Reference: advanced/cli-reference.md
      - JSON Config Reference: advanced/json-config-reference.md
      - Dimension Position Rules: advanced/dimension-position-rules.md
      - Multi-View / Multi-Process: advanced/multi-view-multi-process.md
      - Checkpoints & Resume: advanced/checkpoints-resume.md
      - Exporting & Importing Orders: advanced/exporting-importing-orders.md
  - Examples:
      - RAM-Only Optimization: examples/ram-only-optimization.md
      - View Benchmarking: examples/view-benchmarking.md
      - TI Process Benchmarking: examples/ti-process-benchmarking.md
      - PROD Promotion Workflow: examples/prod-promotion-workflow.md
  - Design Notes:
