<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptimusPy</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Toast notifications (top-right stack) — announced to screen readers -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- Modal overlay -->
  <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true"></div>
  <div id="modal-container" class="modal-container hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title-id"></div>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="/images/logo.svg" alt="OptimusPy" class="logo-icon logo-full">
          <img src="/images/icon.png" alt="OptimusPy" class="logo-icon logo-collapsed">
        </div>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="11 17 6 12 11 7"></polyline>
            <polyline points="18 17 13 12 18 7"></polyline>
          </svg>
        </button>
      </div>

      <!-- Instance switcher -->
      <div class="sidebar-section">
        <div class="instance-switcher" id="instanceSwitcher">
          <button class="instance-switcher-btn" id="instanceSwitcherBtn" disabled aria-haspopup="listbox" aria-expanded="false" aria-label="Select TM1 instance">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
            <span class="instance-name">No instance</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="instance-dropdown hidden" id="instanceDropdown" role="listbox" aria-label="TM1 instances"></div>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="sidebar-nav" aria-label="Main">
        <a class="nav-item" href="#/home" data-page="home">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="nav-label">Home</span>
        </a>

        <a class="nav-item" href="#/nav" data-page="nav">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span class="nav-label">Optimize</span>
        </a>

        <a class="nav-item" href="#/results" data-page="results">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span class="nav-label">Results</span>
        </a>

        <a class="nav-item" href="#/transfer" data-page="transfer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="17 1 21 5 17 9"></polyline>
            <line x1="3" y1="5" x2="21" y2="5"></line>
            <polyline points="7 23 3 19 7 15"></polyline>
            <line x1="21" y1="19" x2="3" y2="19"></line>
          </svg>
          <span class="nav-label">Sync Order</span>
        </a>

        <a class="nav-item" href="#/optimize-db" data-page="optimize-db">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path>
            <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"></path>
          </svg>
          <span class="nav-label">Optimize DB</span>
        </a>
      </nav>

      <!-- Saved cubes sub-items (populated by JS) -->
      <div class="nav-sub-items" id="savedCubesNav"></div>

      <!-- Activity monitor (shown when optimization is running) -->
      <div class="sidebar-activity hidden" id="sidebarActivity"></div>

      <!-- Sidebar footer -->
      <div class="sidebar-footer">
        <a class="nav-item" href="#/settings" data-page="settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span class="nav-label">Settings</span>
        </a>
        <a class="sidebar-link" href="https://cubewise-code.github.io/optimus-py/docs/" target="_blank" rel="noopener noreferrer" aria-label="OptimusPy documentation">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span class="nav-label">Documentation</span>
        </a>
        <a class="sidebar-link" href="https://cubewise-code.github.io/optimus-py/" target="_blank" rel="noopener noreferrer" aria-label="OptimusPy website">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span class="nav-label">Website</span>
        </a>
        <a class="sidebar-link" href="https://github.com/cubewise-code/optimus-py" target="_blank" rel="noopener noreferrer" aria-label="OptimusPy on GitHub">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span class="nav-label">GitHub</span>
        </a>
        <div class="sidebar-version">v2.0</div>
      </div>
    </aside>

    <!-- Mobile sidebar overlay (hidden on desktop) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Mobile menu button (hidden on desktop) -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Main content area -->
    <main class="main-content" id="mainContent" aria-label="Page content">
      <!-- Standard full-width pages -->
      <div class="page" id="page-home"></div>
      <div class="page" id="page-results"></div>
      <div class="page" id="page-jobs"></div>
      <div class="page" id="page-settings"></div>
      <div class="page" id="page-transfer"></div>
      <div class="page" id="page-optimize-db"></div>

      <!-- Split-panel Navigation page (cube list + workspace) -->
      <div class="page split-page" id="page-nav">
        <div class="cube-panel" id="cubePanel">
          <div class="cube-panel-header" id="cubePanelHeader"></div>
          <div class="cube-panel-body" id="cubePanelBody"></div>
        </div>
        <div class="workspace-panel" id="workspacePanel"></div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
