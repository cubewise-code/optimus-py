# OptimusPy Website Deployment Workflow
# Builds the React landing page and the MkDocs documentation,
# merges them, and deploys to GitHub Pages.
# Triggers when website or docs files change. Everything that exists only for
# the website lives in website/; the pages themselves are in docs/.
#
# On a pull request it only builds, as a check: nothing is published. The
# check and the deploy run the same build steps, so a broken landing page or
# docs build is caught in review instead of after the merge.

name: Deploy Website

on:
  push:
    # `optimuspy2dot0` is included so the v2 work-in-progress can be previewed
    # on GitHub Pages before being merged to master. Remove it after the v2
    # merge if you don't want every push to that branch to redeploy.
    branches: [master, main, optimuspy2dot0]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    # `optimuspy2dot0` is checked until the v2 merge. Remove it after the merge.
    branches: [master, optimuspy2dot0]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# The build reads the repository only; the Pages permissions belong to the
# deploy job, which never runs for a pull request.
permissions:
  contents: read

# Deploys queue on one "pages" group and are never cancelled. A pull request's
# check gets its own group, so it neither waits for a deploy nor displaces a
# queued one, and a superseded check is cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/homepage/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install MkDocs dependencies
        run: pip install -r website/requirements.txt

      - name: Install homepage dependencies
        working-directory: website/homepage
        run: npm ci

      - name: Build homepage (React/Vite)
        working-directory: website/homepage
        run: npm run build

      - name: Build documentation (MkDocs)
        # site_dir in mkdocs.yml: website/mkdocs_site. --strict turns broken
        # links and other warnings into a failed build.
        run: mkdocs build --strict -f website/mkdocs.yml

      - name: Merge builds
        run: |
          mkdir -p _site
          cp -r website/homepage/dist/* _site/
          mkdir -p _site/docs
          cp -r website/mkdocs_site/* _site/docs/

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
