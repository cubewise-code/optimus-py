# OptimusPy Website Deployment Workflow
# Builds the React landing page and the MkDocs documentation,
# merges them, and deploys to GitHub Pages.
# Triggers when website or docs files change.

name: Deploy Website

on:
  push:
    # `optimuspy2dot0` is included so the v2 work-in-progress can be previewed
    # on GitHub Pages before being merged to master. Remove it after the v2
    # merge if you don't want every push to that branch to redeploy.
    branches: [master, main, optimuspy2dot0]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'docs-requirements.txt'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/homepage/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install MkDocs dependencies
        run: pip install -r docs-requirements.txt

      - name: Install homepage dependencies
        working-directory: site/homepage
        run: npm ci

      - name: Build homepage (React/Vite)
        working-directory: site/homepage
        run: npm run build

      - name: Build documentation (MkDocs)
        run: mkdocs build --site-dir mkdocs_site

      - name: Merge builds
        run: |
          mkdir -p _site
          cp -r site/homepage/dist/* _site/
          mkdir -p _site/docs
          cp -r mkdocs_site/* _site/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
