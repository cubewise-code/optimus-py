name: Build Executable

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller optimuspy.spec

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: Build ${{ steps.sha.outputs.short }}
          body: "Automated build from commit ${{ github.sha }}"
          files: dist/optimuspy.exe

  build-linux:
    name: Build on Linux (RHEL 8 compatible, x86_64)
    needs: build-windows
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    steps:
      - name: Install system dependencies
        run: |
          dnf -y install python3.11 python3.11-pip python3.11-devel \
                         binutils file git tar gzip

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          python3.11 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install pyinstaller
          /tmp/venv/bin/pip install -r requirements.txt
          echo "/tmp/venv/bin" >> $GITHUB_PATH

      - name: Build executable (onedir)
        run: pyinstaller optimuspy-linux.spec

      - name: Smoke test the binary
        run: |
          ./dist/optimuspy/optimuspy --help || true
          ldd ./dist/optimuspy/optimuspy || true
          echo "Highest GLIBC version referenced:"
          objdump -T ./dist/optimuspy/optimuspy 2>/dev/null | grep GLIBC_ | \
            awk '{print $5}' | sort -V -u | tail -n 5

      - name: Package onedir as tar.gz
        run: |
          mv dist/optimuspy dist/optimuspy-linux
          tar -czf dist/optimuspy-linux.tar.gz -C dist optimuspy-linux

      - name: Get short SHA
        id: sha
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: Build ${{ steps.sha.outputs.short }}
          body: "Automated build from commit ${{ github.sha }}"
          files: dist/optimuspy-linux.tar.gz
